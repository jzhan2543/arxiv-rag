      # NOTE: Cloud Run cannot pull from ghcr.io directly — it only deploys
      # images from Artifact Registry. The runbook sets up an Artifact
      # Registry *remote repository* that proxies GHCR, so the deploy step
      # references the proxy path below rather than ghcr.io. No second push
