[project]
name = "arxiv-rag"
version = "0.0.0"
description = "Bounded agentic RAG over arXiv agentic-RAG papers; v0 learning vehicle for Docker + GH Actions + Cloud Run."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "anthropic",
    "voyageai",
    "sqlite-vec",
    "arxiv",
    "ragas",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "respx",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "voyageai.*", "ragas.*", "arxiv.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
